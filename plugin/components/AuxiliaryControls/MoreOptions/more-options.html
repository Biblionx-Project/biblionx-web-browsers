<div class="vp-more-options-container">
  <div class="vp-more-options-header">
    <span>Más opciones</span>
    <button aria-label="Cerrar" type="button"></button>
  </div>

  <div class="vp-more-options-content">
    <div class="vp-more-option">
      <button
        class="vp-translator-button"
        type="button"
        aria-label="Traducir a Libras"
      ></button>
      <span>Traductor</span>
    </div>

    <div
      class="vp-more-option"
      type="button"
      aria-label="Cambiar expresión facial del avatar"
    >
      <button class="vp-emotions-button"></button>
      <span>Emociones</span>
    </div>

    <div class="vp-more-option vp-up-coming">
      <button
        class="vp-other-resources-button"
        type="button"
        aria-label="Otros recursos de asistencia"
      ></button>
      <span>Otros<br />Recursos</span>
    </div>
  </div>
</div>
