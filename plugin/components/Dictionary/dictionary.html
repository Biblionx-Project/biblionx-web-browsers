<div class="vpw-loading-dictionary">
    <div>
        <span class="vpw-loading__img"></span>
        <span class="vpw-dict-msg--loading">
            Cargando<br>
            Diccionario
        </span>
        <span class="vpw-dict-msg--error">
            Error al<br>
            Cargar
        </span>
        <span class="vpw-dict-msg--max-request">
            Lo sentimos,<br>
            algo salió mal.
        </span>
        <button>Intentar de nuevo</button>
    </div>
</div>

<div class="vpw-panel">
    <div class="vpw-bar">
        <button class="vpw-btn-close"></button>
        <span class="vpw-title">Diccionario</span>
    </div>

    <div class="vpw-search">
        <input type="text" placeholder="Buscar una seña">
        <span class="vpw-icon"></span>
    </div>
</div>

<div class="vpw-buttons-container">
    <button class="vp-dictionary-btn vp-selected">A-Z</button>
    <button class="vp-dictionary-btn">Recientes</button>
</div>

<div class="vpw-recents-container vp-isEmpty">
    <ul></ul>
    <span>No se ha realizado ninguna traducción reciente</span>
</div>

<div class="vpw-dict-container vp-enabled">
    <ul></ul>
    <span></span>
</div>
